repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: local
    hooks:
    -   id: black
        name: black
        description: format code
        entry: poetry run black --line-length 120
        language: system
        'types_or': [python, pyi]
        require_serial: true
    -   id: isort
        name: isort
        description: sort imports
        entry: poetry run isort
        language: system
        'types_or': [python, pyi]
