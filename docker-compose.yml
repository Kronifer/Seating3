version: '3.1'
services:
  seatingmail:
    container_name: seatingmail
    image: seatingmail:latest
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
  seatingapi:
    image: seatingapi:latest
    ports:
      - "8000:8000"
    environment:
      MONGO_USR: "seatingReadWrite"
      MONGO_PASS: "BLxh%2523mspdUWv"
      MONGO_PORT: 27017
      MONGO_CONTAINER_NAME: "serverdb"
      POSTFIX_USR: "noreply"
      POSTFIX_DOMAIN: "seating3.dev"
      POSTFIX_CONN: "seatingmail"
  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - mongo
    command: daemon --docker -f label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  mongo:
    image: mongo
    container_name: serverdb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "seating"
      MONGO_INITDB_ROOT_PASSWORD: "sOVHBtz&Cikm"
      MONGO_INITDB_NEW_USERNAME: "seatingReadWrite"
      MONGO_INITDB_NEW_PASSWORD: "BLxh%23mspdUWv"
      MONGO_INITDB_DATABASE: "seating"
    volumes:
      - ./setup_mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./backups:/backup:rw
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.clearbackups.schedule: "@every 10m"
      ofelia.job-exec.clearbackups.command: "rm -rf /backup/*"
      ofelia.job-exec.backup.schedule: "@every 10m"
      ofelia.job-exec.backup.command: "mongodump -u seating -p sOVHBtz&Cikm -o /backup"
